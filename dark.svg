  <circle cx="1030" cy="510" r="310" fill="url(#bg2)"><animateTransform attributeName="transform" type="translate" values="0 0;-60 -35;0 0" dur="15s" repeatCount="indefinite"/></circle>
  <path d="M0 120H1180M0 300H1180M0 480H1180" stroke="#fff" stroke-opacity=".025"/>
  <g fill="#22D3EE" opacity=".45">
