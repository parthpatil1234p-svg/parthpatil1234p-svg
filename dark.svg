      <text x="34" y="256" fill="#7C3AED">education</text><text x="130" y="256" fill="#CBD5E1">BCA • 2nd Year</text>
      <text x="34" y="284" fill="#7C3AED">college</text><text x="130" y="284" fill="#CBD5E1">G H Raisoni College of Engineering</text>
