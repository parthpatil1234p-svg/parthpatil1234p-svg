<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Parth Patil GitHub profile hero">
<defs>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="50%" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="bg1"><stop stop-color="#312E81" stop-opacity=".42"/><stop offset="1" stop-color="#030712" stop-opacity="0"/></radialGradient>
  <radialGradient id="bg2"><stop stop-color="#0891B2" stop-opacity=".22"/><stop offset="1" stop-color="#030712" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="clip"><rect x="12" y="12" width="1156" height="586" rx="34"/></clipPath>
</defs>
<rect width="1180" height="610" rx="34" fill="#030712"/>
<g clip-path="url(#clip)">
