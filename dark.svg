    <text x="34" y="169" font-family="monospace" font-size="15" fill="#22D3EE">AI Explorer</text>
    <rect x="34" y="179" width="9" height="18" fill="#22D3EE" opacity=".9"><animate attributeName="opacity" values=".1;1;.1" dur="1s" repeatCount="indefinite"/></rect>

