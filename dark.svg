      <text x="34" y="330" fill="#7C3AED">focus</text><text x="130" y="330" fill="#CBD5E1">Full Stack Web Development • Generative AI</text>
      <text x="34" y="358" fill="#7C3AED">email</text><text x="130" y="358" fill="#CBD5E1">parthpatil1234p@gmail.com</text>
    </g>

    <text x="34" y="397" font-family="monospace" font-size="11" fill="#64748B">skills</text>
    <g font-family="monospace" font-size="11">
      <rect x="34" y="408" width="165" height="28" rx="14" fill="#7C3AED" fill-opacity=".16" stroke="#7C3AED" stroke-opacity=".5"/>
      <text x="48" y="427" fill="#E9D5FF">FULL STACK WEB DEV</text>
      <rect x="209" y="408" width="105" height="28" rx="14" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".5"/>
      <text x="229" y="427" fill="#CFFAFE">AI EXPLORER</text>
    </g>
  </g>

  <g transform="translate(70 510)" font-family="monospace" font-size="11">
    <text x="0" y="0" fill="#64748B">CONNECT</text>
    <text x="86" y="0" fill="#F8FAFC">GitHub: parthpatil1234p-svg</text>
    <text x="300" y="0" fill="#22D3EE">LinkedIn</text>
    <text x="380" y="0" fill="#64748B">•</text>
    <text x="400" y="0" fill="#94A3B8">Portfolio: coming soon</text>
  </g>

  <rect x="0" y="0" width="1180" height="2" fill="url(#accent)" opacity=".55">
