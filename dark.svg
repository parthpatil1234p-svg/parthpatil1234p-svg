    <circle cx="24" cy="24" r="5" fill="#7C3AED"/><circle cx="42" cy="24" r="5" fill="#22D3EE"/><circle cx="60" cy="24" r="5" fill="#10B981"/>
    <text x="88" y="29" font-family="monospace" font-size="11" fill="#64748B">parth@github: ~/profile</text>

