      <text x="0" y="48" opacity="0"><animate attributeName="opacity" values="0;1" begin=".2s" dur=".5s" fill="freeze"/>(づ｡◕‿‿◕｡)づ</text>
      <text x="0" y="66" opacity="0"><animate attributeName="opacity" values="0;1" begin=".45s" dur=".5s" fill="freeze"/>      ╭──────────╮</text>
      <text x="0" y="84" opacity="0"><animate attributeName="opacity" values="0;1" begin=".7s" dur=".5s" fill="freeze"/>      │  PARTH   │</text>
      <text x="0" y="102" opacity="0"><animate attributeName="opacity" values="0;1" begin=".95s" dur=".5s" fill="freeze"/>      │  PATIL    │</text>
      <text x="0" y="120" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.2s" dur=".5s" fill="freeze"/>      ╰──────────╯</text>
      <text x="0" y="138" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.45s" dur=".5s" fill="freeze"/>        ╱╲  ╱╲</text>
      <text x="0" y="156" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.7s" dur=".5s" fill="freeze"/>       ╱  ╲╱  ╲</text>
    </g>
    <text x="0" y="212" font-family="monospace" font-size="12" fill="#94A3B8">BCA STUDENT • FULL STACK • AI</text>
